<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" font-family="'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', cursive" role="img" aria-label="Dessin à la craie : les capteurs des dômes, de la cuve et des batteries envoient leurs mesures vers l'écran du journal de bord">
  <defs>
    <filter id="craie" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>

  <!-- le tableau -->
  <rect width="660" height="200" rx="16" fill="#1b2422"/>

  <g filter="url(#craie)" fill="none" stroke="#f4f1e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- un dôme et son antenne -->
    <path d="M24 78 A34 34 0 0 1 92 78 Z"/>
    <path d="M58 44 V26"/>
    <path d="M48 26 Q58 16 68 26" stroke="#8fe0b0"/>
    <path d="M42 20 Q58 4 74 20" stroke="#8fe0b0"/>

    <!-- la cuve d'eau -->
    <path d="M36 108 V140 H80 V108"/>
    <path d="M36 108 Q58 100 80 108 Q58 116 36 108"/>
    <path d="M36 124 Q58 130 80 124" stroke="#8fc7f2"/>

    <!-- la batterie -->
    <path d="M30 160 H80 V184 H30 Z M80 167 H86 V177 H80"/>
    <path d="M38 166 V178 M48 166 V178 M58 166 V178" stroke="#ffd27a"/>

    <!-- les mesures partent vers le journal -->
    <path d="M104 62 Q150 62 196 80 M186 70 L196 80 L182 82" />
    <path d="M94 124 H196 M184 116 L196 124 L184 132"/>
    <path d="M98 172 Q150 172 196 152 M182 150 L196 152 L188 164"/>

    <!-- l'écran du journal -->
    <path d="M214 22 H520 V170 H214 Z"/>
    <path d="M214 46 H520"/>
    <circle cx="230" cy="34" r="3"/><circle cx="244" cy="34" r="3"/><circle cx="258" cy="34" r="3"/>
    <path d="M340 170 V184 M394 170 V184 M310 186 H424"/>

    <!-- la loupe : à nous d'analyser -->
    <circle cx="582" cy="88" r="30"/>
    <path d="M604 110 L636 146"/>
    <path d="M566 80 Q574 68 588 68"/>
  </g>

  <!-- quelques lignes du journal : police à chasse fixe pour rester lisible de loin -->
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="bold">
    <text x="228" y="76"  fill="#8fe0b0">oxygene:Habitat:82</text>
    <text x="228" y="104" fill="#8fc7f2">eau:cuve:120</text>
    <text x="228" y="132" fill="#ff9a8c">oxygene:Labo:erreur</text>
    <text x="228" y="160" fill="#ffd27a">batterie:secours:100</text>
  </g>
  <text x="582" y="96" text-anchor="middle" font-size="24" fill="#f4f1e8">?</text>
</svg>
